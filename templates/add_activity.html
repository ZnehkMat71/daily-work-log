
{% extends "base.html" %}

{% block content %}

<section class="welcome">
    <p class="eyebrow">WORKSPACE / ACTIVITIES</p>
    <h2>Record your work.</h2>
    <p>Document the tasks you completed or are currently working on.</p>
</section>

<section class="content-card">
    <div class="section-heading">
        <div>
            <h2>Activity Details</h2>
            <p>Fields marked with * are required.</p>
        </div>
    </div>

    <form method="POST"
          action="{{ url_for('add_activity') }}"
          class="activity-form">

        <div class="form-grid">
            <div class="form-field">
                <label for="title">Activity title *</label>
                <input type="text"
                       id="title"
                       name="title"
                       value="{{ form_data.title if form_data else '' }}"
                       maxlength="200"
                       required
                       placeholder="e.g. Check computer equipment">
            </div>

            <div class="form-field">
                <label for="activity_date">Date *</label>
                <input type="date"
                       id="activity_date"
                       name="activity_date"
                       value="{{ form_data.activity_date if form_data else today }}"
                       max="{{ today }}"
                       required>
            </div>

            <div class="form-field">
                <label for="activity_time">Time (optional)</label>
                <input type="time"
                       id="activity_time"
                       name="activity_time"
                       value="{{ form_data.activity_time if form_data else '' }}">
            </div>

            <div class="form-field">
                <label for="priority">Priority</label>
                <select id="priority" name="priority">
                    {% set selected_priority = form_data.priority if form_data else 'Medium' %}
                    <option value="Low" {% if selected_priority == 'Low' %}selected{% endif %}>Low</option>
                    <option value="Medium" {% if selected_priority == 'Medium' %}selected{% endif %}>Medium</option>
                    <option value="High" {% if selected_priority == 'High' %}selected{% endif %}>High</option>
                </select>
            </div>

            <div class="form-field">
                <label for="status">Status</label>
                <select id="status" name="status">
                    {% set selected_status = form_data.status if form_data else 'Pending' %}
                    <option value="Pending" {% if selected_status == 'Pending' %}selected{% endif %}>Pending</option>
                    <option value="In Progress" {% if selected_status == 'In Progress' %}selected{% endif %}>In Progress</option>
                    <option value="Completed" {% if selected_status == 'Completed' %}selected{% endif %}>Completed</option>
                </select>
            </div>

            <div class="form-field full-width">
                <label for="notes">Description / Notes</label>
                <textarea id="notes"
                          name="notes"
                          rows="4"
                          placeholder="Describe what you worked on...">{{ form_data.notes if form_data else '' }}</textarea>
            </div>
        </div>

        <button type="submit" class="primary-button">
            Save Activity
        </button>

        <a href="{{ url_for('dashboard') }}" class="clear-button">
            Cancel
        </a>
    </form>
</section>

{% endblock %}
