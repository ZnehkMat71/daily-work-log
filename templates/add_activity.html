
{% extends "base.html" %}

{% block content %}

<section class="welcome">
    <p class="eyebrow">WORKSPACE / ACTIVITIES</p>
    <h2>Record your work.</h2>
    <p>Document the tasks you completed or are currently working on.</p>
</section>

<section class="content-card">
    <div class="section-heading">
        <div>
            <h2>Activity Details</h2>
            <p>Fields marked with * are required.</p>
        </div>
    </div>

    <form method="POST"
          action="{{ url_for('add_activity') }}"
          class="activity-form">

        <div class="form-grid">
            <div class="form-field">
                <label for="title">Activity title *</label>
                <input type="text"
                       id="title"
                       name="title"
                       maxlength="200"
                       required
                       placeholder="e.g. Check computer equipment">
            </div>

            <div class="form-field">
                <label for="activity_date">Date *</label>
                <input type="date"
                       id="activity_date"
                       name="activity_date"
                       value="{{ today }}"
                       max="{{ today }}"
                       required>
            </div>

            <div class="form-field">
                <label for="activity_time">Time (optional)</label>
                <input type="time"
                       id="activity_time"
                       name="activity_time">
            </div>

            <div class="form-field">
                <label for="priority">Priority</label>
                <select id="priority" name="priority">
                    <option>Low</option>
                    <option selected>Medium</option>
                    <option>High</option>
                </select>
            </div>

            <div class="form-field">
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option selected>Pending</option>
                    <option>In Progress</option>
                    <option>Completed</option>
                </select>
            </div>

            <div class="form-field full-width">
                <label for="notes">Description / Notes</label>
                <textarea id="notes"
                          name="notes"
                          rows="4"
                          placeholder="Describe what you worked on..."></textarea>
            </div>
        </div>

        <button type="submit" class="primary-button">
            Save Activity
        </button>

        <a href="{{ url_for('dashboard') }}" class="clear-button">
            Cancel
        </a>
    </form>
</section>

{% endblock %}
