
{% extends "base.html" %}
{% block content %}

<!-- Edit Activity description -->
<div class="page-description">
    <p>Update your existing activity details.</p>
</div>

<!-- Edit Activity form card -->
<div class="card edit-activity-card">

    <div class="section-heading">
        <div>
            <h2>Activity Details</h2>
            <p>Modify the information below.</p>
        </div>
    </div>

    <form method="POST">

        <!-- Date and Time -->
        <div class="form-row">

            <div class="form-group">
                <label for="activity_date">Date *</label>

                <input
                    type="date"
                    id="activity_date"
                    name="activity_date"
                    value="{{ activity['activity_date'] }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="activity_time">Time</label>

                <input
                    type="time"
                    id="activity_time"
                    name="activity_time"
                    value="{{ activity['activity_time'] or '' }}"
                >
            </div>

        </div>

        <!-- Activity Title -->
        <div class="form-group">
            <label for="title">Activity Title *</label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ activity['title'] }}"
                maxlength="200"
                placeholder="Enter activity title"
                required
            >
        </div>

        <!-- Notes -->
        <div class="form-group">
            <label for="notes">Notes</label>

            <textarea
                id="notes"
                name="notes"
                rows="6"
                placeholder="Describe your activity..."
            >{{ activity['notes'] or '' }}</textarea>
        </div>

        <!-- Priority and Status -->
        <div class="form-row">

            <div class="form-group">
                <label for="priority">Priority</label>

                <select id="priority" name="priority">

                    <option value="Low"
                        {% if activity['priority'] == 'Low' %}selected{% endif %}>
                        Low
                    </option>

                    <option value="Medium"
                        {% if activity['priority'] == 'Medium' %}selected{% endif %}>
                        Medium
                    </option>

                    <option value="High"
                        {% if activity['priority'] == 'High' %}selected{% endif %}>
                        High
                    </option>

                </select>
            </div>

            <div class="form-group">
                <label for="status">Status</label>

                <select id="status" name="status">

                    <option value="Pending"
                        {% if activity['status'] == 'Pending' %}selected{% endif %}>
                        Pending
                    </option>

                    <option value="In Progress"
                        {% if activity['status'] == 'In Progress' %}selected{% endif %}>
                        In Progress
                    </option>

                    <option value="Completed"
                        {% if activity['status'] == 'Completed' %}selected{% endif %}>
                        Completed
                    </option>

                </select>
            </div>

        </div>

        <!-- Form buttons -->
        <div class="form-actions">

            <button type="submit" class="btn-primary">
                Save Changes
            </button>

            <a
                href="{{ url_for('work_history') }}"
                class="btn-secondary">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
