
{% extends "base.html" %}
{% block content %}

<!-- Edit Activity description -->
<div class="page-description">
    <p>Update your existing activity details.</p>
</div>

<!-- Edit Activity form card -->
<div class="card edit-activity-card">

    <div class="section-heading">
        <div>
            <h2>Activity Details</h2>
            <p>Modify the information below.</p>
        </div>
    </div>

    <form method="POST"
          action="{{ url_for(
              'edit_activity',
              activity_id=activity['id'],
              keyword=return_params.keyword,
              filter_date=return_params.filter_date,
              page=return_params.page
          ) }}">

        <!-- Date and Time -->
        <div class="form-row">

            <div class="form-group">
                <label for="activity_date">Date *</label>

                <input
                    type="date"
                    id="activity_date"
                    name="activity_date"
                    value="{{ form_data.activity_date if form_data else activity['activity_date'] }}"
                    max="{{ today }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="activity_time">Time</label>

                <input
                    type="time"
                    id="activity_time"
                    name="activity_time"
                    value="{{ form_data.activity_time if form_data else (activity['activity_time'] or '') }}"
                >
            </div>

        </div>

        <!-- Activity Title -->
        <div class="form-group">
            <label for="title">Activity Title *</label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ form_data.title if form_data else activity['title'] }}"
                maxlength="200"
                placeholder="Enter activity title"
                required
            >
        </div>

        <!-- Notes -->
        <div class="form-group">
            <label for="notes">Notes</label>

            <textarea
                id="notes"
                name="notes"
                rows="6"
                placeholder="Describe your activity..."
            >{{ form_data.notes if form_data else (activity['notes'] or '') }}</textarea>
        </div>

        <!-- Priority and Status -->
        <div class="form-row">

            <div class="form-group">
                <label for="priority">Priority</label>

                <select id="priority" name="priority">

                    <option value="Low"
                        {% if (form_data.priority if form_data else activity['priority']) == 'Low' %}selected{% endif %}>
                        Low
                    </option>

                    <option value="Medium"
                        {% if (form_data.priority if form_data else activity['priority']) == 'Medium' %}selected{% endif %}>
                        Medium
                    </option>

                    <option value="High"
                        {% if (form_data.priority if form_data else activity['priority']) == 'High' %}selected{% endif %}>
                        High
                    </option>

                </select>
            </div>

            <div class="form-group">
                <label for="status">Status</label>

                <select id="status" name="status">

                    <option value="Pending"
                        {% if (form_data.status if form_data else activity['status']) == 'Pending' %}selected{% endif %}>
                        Pending
                    </option>

                    <option value="In Progress"
                        {% if (form_data.status if form_data else activity['status']) == 'In Progress' %}selected{% endif %}>
                        In Progress
                    </option>

                    <option value="Completed"
                        {% if (form_data.status if form_data else activity['status']) == 'Completed' %}selected{% endif %}>
                        Completed
                    </option>

                </select>
            </div>

        </div>

        <!-- Form buttons -->
        <div class="form-actions">

            <button type="submit" class="btn-primary">
                Save Changes
            </button>

            <a
                href="{{ url_for(
                    'work_history',
                    keyword=return_params.keyword,
                    filter_date=return_params.filter_date,
                    page=return_params.page
                ) }}"
                class="btn-secondary">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
